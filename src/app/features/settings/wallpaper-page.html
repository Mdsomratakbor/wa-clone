<app-navigation-bar
  title="Wallpaper"
  [leading]="leadingActions"
  (action)="onNavAction($event)"
></app-navigation-bar>

<main class="wallpaper" data-testid="wallpaper-page">
  <div
    class="wallpaper__options"
    role="radiogroup"
    aria-label="Wallpaper"
    data-testid="wallpaper-options"
  >
    @for (option of options; track option.id) {
      <button
        type="button"
        role="radio"
        class="wallpaper__option"
        data-testid="wallpaper-option"
        [class.wallpaper__option--selected]="isSelected(option.id)"
        [attr.aria-checked]="isSelected(option.id)"
        [attr.aria-label]="option.label"
        (click)="onSelect(option.id)"
      >
        <span
          class="wallpaper__swatch"
          [attr.data-wallpaper]="option.id"
          aria-hidden="true"
        ></span>
        <span class="wallpaper__label">{{ option.label }}</span>
        <svg
          class="wallpaper__check"
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M4 10.5 8 14.5 16 5.5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    }
  </div>
</main>
