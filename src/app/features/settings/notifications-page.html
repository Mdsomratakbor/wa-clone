<app-navigation-bar
  title="Notifications"
  [leading]="leadingActions"
  (action)="onNavAction($event)"
></app-navigation-bar>

<main class="notifications" data-testid="notifications-page">
  <ul class="notifications__list" data-testid="notifications-list">
    @for (row of rows; track row.id) {
      <li class="notifications__row">
        @if (row.unavailable) {
          <!--
            F-046 FR-006 and FR-011: a setting with no consumer. Not a chevron
            button - that would fall through to onRowActivate and be a new silent
            no-op. `Show previews` is the one wired row, and it is not unavailable.
          -->
          <div
            class="notifications__switch-row notifications__row--unavailable"
            data-testid="notifications-row"
            [attr.data-testid-unavailable]="'true'"
            [attr.aria-label]="row.label"
          >
            <span class="notifications__row-label">{{ row.label }}</span>
            <app-toggle [label]="row.label" [disabled]="true" />
          </div>
        } @else if (toggleKey(row.id); as prefsKey) {
          <div
            class="notifications__switch-row"
            data-testid="notifications-row"
            [attr.aria-label]="row.label"
          >
            <span class="notifications__row-label">{{ row.label }}</span>
            <app-toggle
              [checked]="prefs()[prefsKey]"
              [label]="row.label"
              (checkedChange)="onToggle(prefsKey, $event)"
            />
          </div>
        } @else {
          <!--
            Unreachable with the current seed: every Notifications row is either
            unavailable or has a pref key. Rendered as a disabled switch rather
            than omitted or, worse, a chevron, so that adding a row to the seed
            can never recreate the silent no-op this feature removes.
          -->
          <div
            class="notifications__switch-row notifications__row--unavailable"
            data-testid="notifications-row"
            [attr.data-testid-unavailable]="'true'"
            [attr.aria-label]="row.label"
          >
            <span class="notifications__row-label">{{ row.label }}</span>
            <app-toggle [label]="row.label" [disabled]="true" />
          </div>
        }
      </li>
    }
  </ul>
</main>
