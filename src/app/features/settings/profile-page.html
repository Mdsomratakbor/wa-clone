<app-navigation-bar
  title="Edit Profile"
  [leading]="leadingActions"
  (action)="onNavAction($event)"
></app-navigation-bar>

<main class="profile" data-testid="profile-page">
  <div class="profile__form">
    <label class="profile__field">
      <span class="profile__label">Name</span>
      <input
        class="profile__input"
        data-testid="profile-name"
        type="text"
        aria-label="Name"
        #nameInput
        [value]="nameDraft()"
        (input)="nameDraft.set(nameInput.value)"
      />
      <!-- F-055 FR-002: WhatsApp-style hint, same description treatment as F-054. -->
      <span class="profile__hint">Your name is visible to everyone</span>
    </label>

    <label class="profile__field">
      <span class="profile__label">About</span>
      <input
        class="profile__input"
        data-testid="profile-about"
        type="text"
        placeholder="About"
        aria-label="About"
        #aboutInput
        [value]="aboutDraft()"
        (input)="aboutDraft.set(aboutInput.value)"
      />
      <!-- F-055 FR-002: drafted hint, recorded verbatim in the spec appendix. -->
      <span class="profile__hint">Shown next to your name in chats</span>
    </label>

    <button type="button" class="profile__save" data-testid="profile-save" (click)="onSave()">
      Save
    </button>
  </div>
</main>
