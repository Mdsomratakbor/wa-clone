<app-navigation-bar
  title="Contacts"
  [leading]="leadingActions"
  (action)="onNavAction($event)"
></app-navigation-bar>

<main class="contacts" data-testid="contacts-page">
  <div class="contacts__search">
    <svg class="contacts__search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.5" />
      <path d="m11 11 3.2 3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <input
      class="contacts__search-input"
      type="search"
      data-testid="contacts-search"
      placeholder="Search"
      aria-label="Search contacts"
      #searchInput
      [value]="searchQuery()"
      (input)="onSearch(searchInput.value)"
    />
    @if (searchQuery().length > 0) {
      <button
        class="contacts__search-clear"
        type="button"
        data-testid="contacts-search-clear"
        aria-label="Clear search"
        (click)="onClearSearch()"
      >
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    }
  </div>

  @if (contacts().length === 0) {
    <p class="contacts__empty" data-testid="contacts-empty" role="status">{{ emptyLabel() }}</p>
  } @else {
    <ul class="contacts__list" data-testid="contacts-list" aria-label="Contacts">
      @for (contact of contacts(); track contact.id) {
        <li
          class="contacts__row"
          data-testid="contacts-row"
          role="button"
          tabindex="0"
          [attr.aria-label]="contact.contactName"
          (click)="onOpenContact(contact.id)"
          (keydown.enter)="onOpenContact(contact.id)"
          (keydown.space)="onOpenContact(contact.id)"
        >
          <app-user-avatar [src]="contact.avatarRef" [name]="contact.contactName" [size]="40" />
          <span class="contacts__name">{{ contact.contactName }}</span>
        </li>
      }
    </ul>
  }
</main>
