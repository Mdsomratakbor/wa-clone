<div
  class="chat-window"
  [attr.data-font-scale]="fontScale()"
  [attr.data-wallpaper]="wallpaper()"
>
  <app-chat-header
    [contact]="contact()"
    (back)="onBack()"
    (identity)="onIdentity()"
    (actions)="onChatActions()"
    (voiceCall)="onCall('voice')"
    (videoCall)="onCall('video')"
  />

  <div class="chat-window__thread" #thread data-testid="message-thread" role="list" [attr.aria-label]="'Conversation with ' + contact().name">
    @if (!listEmpty()) {
      <ol class="chat-window__list">
        @for (message of messages(); track message.id; let index = $index) {
          @if (index === 2) {
            <li class="chat-window__chip-row">
              <div class="chat-window__date" role="status">
                <span class="chat-window__date-chip">{{ dateChip }}</span>
              </div>
            </li>
          }
          <li class="chat-window__row chat-window__row--{{ message.sender }}">
            <app-message-bubble
              [message]="message"
              [starred]="isStarred(message.id)"
              (star)="onStarMessage($event)"
            />
          </li>
        }
      </ol>
    }
  </div>

  <app-composer (send)="onSend($event)" (sendAttachment)="onSendAttachment($event)" />

  @if (chatActionsOpen()) {
    <app-chat-actions-modal
      [muted]="muted()"
      (action)="onChatAction($event)"
      (dismiss)="onDismissChatActions()"
    />
  }

  @if (chatMoreOpen()) {
    <app-action-sheet
      [actions]="moreActions"
      (action)="onMoreAction($event)"
      (dismiss)="onDismissMore()"
    />
  }
</div>
