<div class="kb" data-testid="compose-keyboard">
  <div class="kb__row">
    @for (letter of rowOne; track letter) {
      <button
        type="button"
        class="kb__key"
        [attr.data-testid]="'compose-key-' + letter"
        [attr.aria-label]="letter"
        (click)="tap(letter)"
      >
        {{ label(letter) }}
      </button>
    }
  </div>

  <div class="kb__row">
    <div class="kb__spacer"></div>
    @for (letter of rowTwo; track letter) {
      <button
        type="button"
        class="kb__key"
        [attr.data-testid]="'compose-key-' + letter"
        [attr.aria-label]="letter"
        (click)="tap(letter)"
      >
        {{ label(letter) }}
      </button>
    }
  </div>

  <div class="kb__row">
    <button
      type="button"
      class="kb__key kb__key--special"
      data-testid="compose-key-shift"
      aria-label="Shift"
      [attr.aria-pressed]="shiftOn()"
      (click)="toggleShift()"
    >
      <span class="kb__glyph" aria-hidden="true">⇧</span>
    </button>
    @for (letter of rowThree; track letter) {
      <button
        type="button"
        class="kb__key"
        [attr.data-testid]="'compose-key-' + letter"
        [attr.aria-label]="letter"
        (click)="tap(letter)"
      >
        {{ label(letter) }}
      </button>
    }
    <button
      type="button"
      class="kb__key kb__key--special"
      data-testid="compose-key-backspace"
      aria-label="Delete"
      [disabled]="!canDelete()"
      (click)="delete()"
    >
      <span class="kb__glyph" aria-hidden="true">⌫</span>
    </button>
  </div>

  <div class="kb__row kb__row--wide">
    <button
      type="button"
      class="kb__key kb__key--special kb__key--space"
      data-testid="compose-key-space"
      aria-label="Space"
      (click)="space()"
    ></button>
    <button
      type="button"
      class="kb__key kb__key--special kb__key--send"
      data-testid="compose-key-send"
      aria-label="Send status"
      [disabled]="!canSend()"
      (click)="sendKey()"
    >
      <svg class="kb__send-glyph" width="18" height="18" viewBox="313.98 0 24.04 23.63" fill="none" aria-hidden="true">
        <path
          d="M325.991 0C332.623 0 338 4.48051 338 10.0075C338 20.1346 328.386 15.5407 327.065 18.1165C326.251 19.7721 330.38 23.6279 325.991 23.6279C316.964 23.6279 313.982 15.5345 313.982 10.0075C313.982 4.48051 319.359 0 325.991 0ZM318.986 7.50562C317.88 7.50562 316.984 8.40172 316.984 9.50712C316.984 10.6125 317.88 11.5086 318.986 11.5086C320.091 11.5086 320.987 10.6125 320.987 9.50712C320.987 8.40172 320.091 7.50562 318.986 7.50562ZM332.996 7.50562C331.891 7.50562 330.995 8.50612 330.995 9.50712C330.995 10.6125 331.891 11.5086 332.996 11.5086C334.102 11.5086 334.998 10.6125 334.998 9.50712C334.998 8.50612 334.102 7.50562 332.996 7.50562ZM322.989 2.50187C321.883 2.50187 320.987 3.39798 320.987 4.50337C320.987 5.60877 321.883 6.50487 322.989 6.50487C324.094 6.50487 324.99 5.60877 324.99 4.50337C324.99 3.39798 324.094 2.50187 322.989 2.50187ZM328.993 2.50187C327.888 2.50187 326.992 3.39798 326.992 4.50337C326.992 5.60877 327.888 6.50487 328.993 6.50487C330.099 6.50487 330.995 5.60877 330.995 4.50337C330.995 3.39798 330.099 2.50187 328.993 2.50187Z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>
</div>
