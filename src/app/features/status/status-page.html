<app-navigation-bar
  title="Status"
  [leading]="leadingActions"
  (action)="onNavAction($event)"
></app-navigation-bar>

<div class="status-page__body">
  @if (activeTab() === 'status') {
    <div class="status-page__feed" data-testid="status-feed">
      <div
        class="status-page__row"
        role="button"
        tabindex="0"
        aria-label="My Status, Add to my status"
        data-testid="status-my"
        (click)="onRowActivate()"
        (keydown.enter)="onRowActivate()"
        (keydown.space)="onRowActivate()"
      >
        <div class="status-page__avatar" data-testid="status-avatar">
          <app-user-avatar [name]="'My Status'" [size]="58" />
          <span class="status-page__badge" data-testid="status-badge" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M10 20C15.5228 20 20 15.5228 20 10C20 4.47715 15.5228 0 10 0C4.47715 0 0 4.47715 0 10C0 15.5228 4.47715 20 10 20Z"
                fill="#007AFF"
              />
              <path
                d="M9.88338 4.00673L10 4C10.5128 4 10.9355 4.38604 10.9933 4.88338L11 5V9H15C15.5128 9 15.9355 9.38604 15.9933 9.88338L16 10C16 10.5128 15.614 10.9355 15.1166 10.9933L15 11H11V15C11 15.5128 10.614 15.9355 10.1166 15.9933L10 16C9.48716 16 9.06449 15.614 9.00673 15.1166L9 15V11H5C4.48716 11 4.06449 10.614 4.00673 10.1166L4 10C4 9.48716 4.38604 9.06449 4.88338 9.00673L5 9H9V5C9 4.48716 9.38604 4.06449 9.88338 4.00673L10 4L9.88338 4.00673Z"
                fill="white"
              />
            </svg>
          </span>
        </div>
        <div class="status-page__copy">
          <p class="status-page__name">My Status</p>
          <p class="status-page__subtitle">Add to my status</p>
        </div>
        <div class="status-page__actions">
          <button
            class="status-page__circle"
            type="button"
            data-testid="status-camera"
            aria-label="Add a photo to my status"
            (click)="onCamera()"
          >
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M19.3131 10.25C19.8705 10.25 20.4027 10.4827 20.7813 10.8919L22.5 12.75H24.25C25.6307 12.75 26.75 13.8693 26.75 15.25V22.75C26.75 24.1307 25.6307 25.25 24.25 25.25H11.75C10.3693 25.25 9.25 24.1307 9.25 22.75V15.25C9.25 13.8693 10.3693 12.75 11.75 12.75H13.5L15.2187 10.8919C15.5973 10.4827 16.1295 10.25 16.6869 10.25H19.3131ZM18 14.25C15.6528 14.25 13.75 16.1528 13.75 18.5C13.75 20.8472 15.6528 22.75 18 22.75C20.3472 22.75 22.25 20.8472 22.25 18.5C22.25 16.1528 20.3472 14.25 18 14.25ZM18 15.25C19.7949 15.25 21.25 16.7051 21.25 18.5C21.25 20.2949 19.7949 21.75 18 21.75C16.2051 21.75 14.75 20.2949 14.75 18.5C14.75 16.7051 16.2051 15.25 18 15.25Z"
                fill="#007AFF"
              />
            </svg>
          </button>
          <button
            class="status-page__circle"
            type="button"
            data-testid="status-note"
            aria-label="Add a text to my status"
            (click)="onNote()"
          >
            <svg width="36" height="36" viewBox="52 0 36 36" fill="none">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M63.0601 22.1207L66.1881 25.2495C65.9796 25.4001 62.8277 27.0081 62.062 26.2423C61.2963 25.4766 62.9095 22.3285 63.0601 22.1207ZM72.7499 12.3786L75.9319 15.5606L67.2759 24.2146L64.0939 21.0326L72.7499 12.3786ZM76.0315 10.5134L77.7993 12.2812C78.1599 12.6416 78.1876 13.2088 77.8826 13.6011L77.7992 13.6953L76.9929 14.5006L73.8109 11.3186L74.6172 10.5133C75.0078 10.123 75.6409 10.123 76.0315 10.5134Z"
                fill="#007AFF"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="status-page__tip" data-testid="status-tip" role="status">
        <p class="status-page__tip-text">No recent updates to show right now.</p>
      </div>
    </div>
  } @else {
    <div class="status-page__stub" role="status" data-testid="tab-stub">
      <p class="status-page__stub-text">{{ activeLabel() }} - coming soon</p>
    </div>
  }
</div>

<app-tab-bar [items]="tabs()" (select)="onTabSelect($event)" />
