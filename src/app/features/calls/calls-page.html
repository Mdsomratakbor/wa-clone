<app-navigation-bar
  title=""
  [leading]="leadingActions()"
  [trailing]="trailingActions()"
  (action)="onNavAction($event)"
>
  <div
    class="calls-page__filter"
    data-nav-center
    role="group"
    aria-label="Filter calls"
    data-testid="calls-filter"
  >
    <button
      type="button"
      disabled
      class="calls-page__filter-item calls-page__filter-item--active"
      data-testid="filter-all"
    >
      All
    </button>
    <button type="button" disabled class="calls-page__filter-item" data-testid="filter-missed">
      Missed
    </button>
  </div>
</app-navigation-bar>

<div class="calls-page__body">
  @if (activeTab() === 'calls') {
    @if (items().length > 0) {
      <ul class="calls-page__list" data-testid="call-list">
        @for (call of items(); track call.id) {
          <li class="calls-page__row">
            <app-call-list-item
              [call]="call"
              [editMode]="editing()"
              (selected)="onCallSelected($event)"
              (info)="onCallInfo($event)"
              (remove)="onCallRemove($event)"
            />
          </li>
        }
      </ul>
    } @else {
      <div class="calls-page__empty" role="status" data-testid="empty-state">
        <p class="calls-page__empty-text">No calls</p>
      </div>
    }
  } @else {
    <div class="calls-page__stub" role="status" data-testid="tab-stub">
      <p class="calls-page__stub-text">{{ activeLabel() }} — coming soon</p>
    </div>
  }
</div>

<app-tab-bar [items]="tabs()" (select)="onTabSelect($event)" />
