<div class="composer" data-testid="composer" role="toolbar" aria-label="Message composer">
  <button class="composer__control composer__add" type="button" aria-label="Add attachment">
    <svg class="composer__icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M9 1.5v15M1.5 9h15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>

  <div class="composer__field">
    <input class="composer__input" type="text" aria-label="Message" />
    <button class="composer__control composer__sticker" type="button" aria-label="Emoji stickers">
      <svg class="composer__icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.6" />
        <circle cx="6.4" cy="7" r="1" fill="currentColor" />
        <circle cx="11.6" cy="7" r="1" fill="currentColor" />
        <path d="M5.5 10.5a4.6 4.6 0 0 0 7 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <button class="composer__control composer__camera" type="button" aria-label="Camera">
    <svg class="composer__icon" width="22" height="17" viewBox="0 0 22 17" fill="none" aria-hidden="true">
      <rect x="1" y="2.5" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7" />
      <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.7" />
      <path d="M15 5.5h4l2 3v2l-2 1" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
    </svg>
  </button>

  <button class="composer__control composer__mic" type="button" aria-label="Record audio">
    <svg class="composer__icon" width="15" height="22" viewBox="0 0 15 22" fill="none" aria-hidden="true">
      <rect x="2.5" y="1" width="10" height="15" rx="5" stroke="currentColor" stroke-width="1.7" />
      <path d="M2 10.5a5.5 5.5 0 0 0 11 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      <path d="M7.5 21v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
    </svg>
  </button>
</div>
