<button
  type="button"
  class="toggle"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="onActivate()"
>
  <span class="toggle__track" [class.toggle__track--on]="checked()">
    <span class="toggle__knob"></span>
  </span>
</button>
