<header class="chat-header" data-testid="chat-header" aria-label="Contact header">
  <button
    class="chat-header__back"
    type="button"
    [attr.aria-label]="backLabel()"
    (click)="back.emit()"
  >
    <svg class="chat-header__icon" width="12" height="21" viewBox="0 0 12 21" fill="none" aria-hidden="true">
      <path
        d="M11 1 2 10.5 11 20"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <app-user-avatar [src]="contact().avatarRef" [name]="contact().name" [size]="36" />

  <div class="chat-header__titles">
    <h1 class="chat-header__name">{{ contact().name }}</h1>
    <p class="chat-header__subtitle">{{ contact().subtitle }}</p>
  </div>

  <span class="chat-header__spacer" aria-hidden="true"></span>

  <button class="chat-header__icon-button" type="button" aria-label="Video call, coming soon">
    <svg class="chat-header__icon" width="24" height="15" viewBox="0 0 24 15" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="17" height="13" rx="3" stroke="currentColor" stroke-width="1.7" />
      <path
        d="M18.5 5.5 23 3v9l-4.5-2.5"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <button class="chat-header__icon-button" type="button" aria-label="Call, coming soon">
    <svg class="chat-header__icon" width="21" height="21" viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <path
        d="M4.5 2.5h3l1.5 4-2 1.5a12.5 12.5 0 0 0 6 6l1.5-2 4 1.5v3a1.5 1.5 0 0 1-1.7 1.5C10 17.7 3.3 11 2 4.7A1.5 1.5 0 0 1 3.5 2.5h1Z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</header>
