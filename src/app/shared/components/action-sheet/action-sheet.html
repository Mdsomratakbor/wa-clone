@if (actions().length > 0) {
  <div class="action-sheet__overlay" data-testid="action-sheet-overlay">
    <button
      class="action-sheet__backdrop"
      type="button"
      aria-label="Close"
      data-testid="action-sheet-backdrop"
      (click)="onBackdrop()"
    ></button>
    <div
      class="action-sheet__sheet"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || 'Actions'"
      data-testid="action-sheet"
    >
      @if (title()) {
        <h2 class="action-sheet__title" data-testid="action-sheet-title">{{ title() }}</h2>
      }
      <ul class="action-sheet__rows" data-testid="action-sheet-rows">
        @for (item of actions(); track item.id) {
          <li class="action-sheet__row">
            <button
              class="action-sheet__row-button"
              type="button"
              data-testid="action-sheet-row"
              (click)="onAction(item.id)"
            >
              {{ item.label }}
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
}
